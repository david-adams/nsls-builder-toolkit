name: windows-hooks

# The Macs that write these hooks have no PowerShell. This is the only place
# session-start.ps1 is parsed under Windows PowerShell 5.1 and PowerShell 7
# before it reaches a PC, and the only place the fork-check lock is proven to
# admit one holder at a time across the two languages that share it on Windows.
on:
  pull_request:
    paths:
      - 'hooks/**'
      - 'install.ps1'
      - 'CLAUDE.md'
      - '_shared/references/guardrail-*.md'
      - '.github/workflows/windows-hooks.yml'
  push:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'install.ps1'
      - 'CLAUDE.md'
      - '_shared/references/guardrail-*.md'
      - '.github/workflows/windows-hooks.yml'

permissions:
  contents: read

jobs:
  windows-hooks:
    name: hooks parse (PS 5.1 + 7) and the fork-check lock excludes
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse every hook script under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/parse-hooks.ps1
      - name: The skill-event hook proves itself from a Windows path, so stage B can finish on a PC
        shell: pwsh
        run: python hooks/tests/test_skill_event_beacon_windows.py
      - name: Parse every hook script under PowerShell 7
        shell: pwsh
        run: ./hooks/tests/windows/parse-hooks.ps1
      - name: install.ps1 finds the claude CLI a Store-installed Claude app hides, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/install-find-cli.ps1
      - name: The hook's Python step runs, and says so when it cannot, under the exact settings.json command (PS 5.1)
        shell: powershell
        run: ./hooks/tests/windows/shim-python-step.ps1
      - name: install.ps1 gives settings.json back as it found it (accents, a builder's own hooks, a copy, no torn write), under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/install-settings-roundtrip.ps1
      - name: One holder at a time, PowerShell and Python, on a real PC
        shell: pwsh
        run: ./hooks/tests/windows/lock-smoke.ps1
      - name: install.ps1 counts Git Bash wherever Claude Code finds it, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/install-git-bash.ps1
      - name: Collector evidence silences the skill hook, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/collector-evidence.ps1
      - name: The hook makes the personal toolkit's old pull entry safe from a git hook's variables, and touches nothing else (PS 5.1)
        shell: powershell
        run: ./hooks/tests/windows/personal-pull-upgrade.ps1
      - name: The session that updates the hook runs the new copy, not the old one, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/rerun-after-update.ps1
      - name: A clean fork catches itself up; nothing of theirs, no operation in progress, no merge setting or hook changes that, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/fork-ff-smoke.ps1
      - name: Once the plugin is active the hook stops writing org pointers but still notices the builder's own skills, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/pointers-after-plugin.ps1
      - name: The daily update keeps ignored files, neutralises merge settings, runs no hooks, and leaves an operation in progress alone, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/daily-pull-smoke.ps1
      - name: install.ps1 asks the plugin which hooks it already runs, and ignores a disabled plugin, under Windows PowerShell 5.1
        shell: powershell
        run: ./hooks/tests/windows/install-beacon-answer.ps1
      - name: Collector bootstrap launches once, hidden, and stays out when installed or opted out (PS 5.1)
        shell: powershell
        run: ./hooks/tests/windows/collector-bootstrap.ps1
      - name: Stage B retires only exact toolkit pointers and never deletes a builder skill, on a real PC
        shell: pwsh
        run: python hooks/tests/test_stage_b_keeps_builder_skills.py
      - name: A push through the PowerShell tool is judged by PowerShell's rules, on a real PC
        shell: pwsh
        run: python hooks/tests/test_gate_powershell_paths.py
      - name: The installer shows git's own error text, not a PowerShell error dump (PS 5.1)
        shell: powershell
        run: ./hooks/tests/windows/installer-native-output.ps1
      - name: The installer shows git's own error text (PowerShell 7)
        shell: pwsh
        run: ./hooks/tests/windows/installer-native-output.ps1
      - name: The plugin hooks speak UTF-8 on a Windows pipe (policy printed whole, gate reads accented paths and emoji)
        shell: pwsh
        run: python hooks/tests/test_plugin_hooks_utf8.py
      - name: The guardrail policy reaches Claude whole (under the hook-output cap, its own hook on clear and compact, no bare python3)
        shell: pwsh
        run: python hooks/tests/test_guardrail_policy_budget.py
      - name: The installed-skills neighbour check ignores one shared common word, and still finds a real neighbour
        shell: pwsh
        run: python test/test_similar_skills.py
