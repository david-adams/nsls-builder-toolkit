name: windows-hooks

# The Macs that write these hooks have no PowerShell. This is the only place
# session-start.ps1 is parsed under Windows PowerShell 5.1 and PowerShell 7
# before it reaches a PC, and the only place the fork-check lock is proven to
# admit one holder at a time across the two languages that share it on Windows.
on:
  pull_request:
    paths:
      - 'hooks/**'
      - 'install.ps1'
      - 'CLAUDE.md'
      - '_shared/references/guardrail-*.md'
      - '.github/workflows/windows-hooks.yml'
      - 'test/**'
  push:
    branches: [main]
    paths:
      - 'hooks/**'
      - 'install.ps1'
      - 'CLAUDE.md'
      - '_shared/references/guardrail-*.md'
      - '.github/workflows/windows-hooks.yml'
      - 'test/**'

permissions:
  contents: read

jobs:
  windows-hooks:
    name: hooks parse (PS 5.1 + 7) and the fork-check lock excludes
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Each test marks itself with a `# windows-ci:` line (see the runner's docstring), so a
      # PR that adds a test never edits this file and open PRs can't conflict in it. The runner
      # runs PowerShell scripts the way a `shell: powershell` / `pwsh` step would, runs every test
      # even after a failure, and groups each one's output in the log.
      - name: Every test marked for the Windows CI (PowerShell 5.1, PowerShell 7 and Python)
        shell: pwsh
        run: python hooks/tests/run_windows_ci.py
